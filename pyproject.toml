[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-tag-classifier"
version = "0.1.1"
description = "Meta tag text classifier (clean → train → infer): library + CLI"
authors = [{ name = "Sergio Carrasco" }]
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "regex>=2024.5",
  "tqdm>=4.66",
  "sentence-transformers>=3.0.0",
  "numpy>=1.24",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["meta_tag_classifier*"]

[tool.setuptools.package-data]
"meta_tag_classifier" = ["py.typed", "artifacts/*"]

[project.scripts]
mtc = "meta_tag_classifier.cli:main"

[tool.setuptools.package-data]
"meta_tag_classifier" = ["py.typed"]
