# Qwen production inference config
# Training is done outside this deployment repo. Copy trained artifacts into artifacts_dir
# or set artifacts_dir / ARTIFACTS_DIR to a HuggingFace Hub repo id.

artifacts_dir: Trinotrotolueno/meta-tag-classifier/template_classifier
# HuggingFace Hub model repo/subfolder containing the adapter files.

text_column: selected_text
label_column: llm_label
label_mapping_file: label_mapping.json

model:
  backend: qwen_sequence_classifier
  base_model_name: Qwen/Qwen2.5-3B-Instruct
  adapter_dir: adapter
  input_text_source: selected_text_only
  max_length: 512
  inference_batch_size: 8
  load_in_4bit: true

preprocessing:
  keep_clean_preprocessing: true
  selected_text_only: true
