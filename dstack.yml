type: task
name: meta-tag-template-classifier

python: "3.12"

files:
  - .:/workflow

spot_policy: auto

max_price: 0.25

env:
  - QUEUE_URL=http://100.98.79.5:4949/exchange-batch
  - QUEUE_API_KEY=your-queue-api-key
  - QUEUE_KEY=META_TAGS
  - BATCH_SIZE=30
  - EMPTY_QUEUE_SLEEP_SECONDS=60
  - ARTIFACTS_DIR=/workflow/meta_tag_classifier/artifacts

commands:
  - cd /workflow
  - pip install --no-cache-dir -r requirements.txt
  - python3 processor.py

resources:
  gpu: 16GB:1

idle_duration: 6h

retry:
  on_events: [no-capacity, error, interruption]
  duration: 2d
